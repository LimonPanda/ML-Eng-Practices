[project]
name = "bank-marketing"
version = "0.1.0"
description = "Reproducible baseline for the UCI Bank Marketing dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
